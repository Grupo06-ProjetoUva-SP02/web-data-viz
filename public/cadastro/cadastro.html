    <title>Cadastre-se</title>
</head>
<body onload="listar()">
    <header class="header">
        <div class="logo-container">
            <img src="../../assets/img/logo.svg" alt="">
            <h1 class="logo">VITITECH</h1>
        </div>

        <nav class="nav">
            <ul>
                <li><a href="../home/home.html">Home</a></li>
                <li><a href="../calculadora/calculadora.html">Calculadora</a></li>
                <li><a href="../home/home.html">Quem Somos</a></li>
                <li><a href="../cadastro/cadastro.html">Contato</a></li>
                <div class="login">
                    <li><a href="../login/login.html">Login</a></li>
                    <img src="../../assets/img/user.svg" alt="Imagem do botão para logar">
                </div>
            </ul>
        </nav>
    </header>

    <div class="banner">
        <div class="formulario_cadastro">
            <div class="title">
                <span>Cadastre-se</span>
            </div>

            <div class="container_inputs">
                <label for="ipt_codigo">Código de ativação:</label>
                <input type="text" id="ipt_codigo" placeholder="Insira o código de ativação fornecido" onkeyup="verificarEmail()">
            </div>

            <div class="container_inputs">                
                <label for="ipt_telefone">Nome:</label>
                <input type="text" placeholder="Insira seu nome" id="ipt_nome">
            </div>
            
            <div class="container_inputs">
                <label for="ipt_email">E-mail:</label>
                <input type="text" id="ipt_email" placeholder="Insira seu email" onkeyup="verificarEmail()">
            </div>

            <div id="emailValidacao"></div>

            
            <div class="container_inputs">
                <label for="ipt_CPF">CPF:</label>
                <input type="text" placeholder="Insira seu CPF" id="ipt_CPF">
            </div>

            <div class="container_inputs">                
                <label for="ipt_senha">Senha:</label>
                <input type="password" id="ipt_senha" placeholder="Insira sua senha" onkeyup="verificarSenha()">
                <div id="divSenha">A senha deve ter mais que 8 caracteres, uma letra maiúscula e uma mínuscula.</div> <br>
            </div>


            <div class="container_inputs">                
                <label for="ipt_confirmarSenha">Confirmar senha:</label>
                <input type="password" id="ipt_confirmarSenha" placeholder="Confirme sua senha">
            </div>
            
            <button onclick="cadastrar()">Cadastrar</button>
            <div class="link_cadastro">
                Já possui uma conta?
                <a href="../login/login.html">Clique aqui</a>
            </div>
        </div>
    </div>

    </div>
</body>
    <script>
    
    
    function verificar () {
        let email = ipt_email.value
        let cpf = ipt_CPF.value
        let nome = ipt_nome.value
        let senha = ipt_senha.value
        let confirmarSenha = ipt_confirmarSenha.value

        if (email == "" || cpf == "" || nome == "" || senha == "" || confirmarSenha == "") {
            alert (`Preencha todos os campos!`)
        } else if (senha != confirmarSenha) {
            alert (`As senhas não coincidem!`)
        } else {
            alert (`Cadastro realizado com sucesso!`)
        } }

    function verificarEmail() {
        let email = ipt_email.value;
        let indice_com = email.indexOf('.com');
        let indice_arroba = email.indexOf('@');
        let arroba_antes_com = indice_arroba < indice_com;
        let comeca_com_arroba = email.startsWith('@');
        let contem_espaco = email.includes(' ');

        if (!email || !indice_com == -1 || !indice_arroba == -1 || !arroba_antes_com || comeca_com_arroba || contem_espaco) {
            emailValidacao.innerHTML = `<p style="color: red">Email Inválido</p>`
        } else {
            emailValidacao.innerHTML = `<p style="color: green">Email Válido</p>`
        }
    }

    function verificarSenha(){
    let senha = ipt_senha.value
    if(senha.length >= 8){
          divSenha.innerHTML = `<p style="color: red">Senha fraca</p>`
          if(senha != senha.toUpperCase()){
            divSenha.innerHTML = `<p style="color: yellow">Senha média</p>`
            if(senha != senha.toLowerCase()){
              divSenha.innerHTML = `<p style="color: green">Senha forte</p>`
            }
          }
        } else {
          divSenha.innerHTML = `<p style="color: red">Senha insegura</p>`
        }
    }

    </script>
</html>

<script>

  // Array para armazenar empresas cadastradas para validação de código de ativação 
  let listaEmpresasCadastradas = [];

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = ipt_nome.value;
    var emailVar = ipt_email.value;
    var senhaVar = ipt_senha.value;
    var cpfVar = ipt_CPF.value;
    var confirmacaoSenhaVar = ipt_confirmarSenha.value;
    var codigoVar = ipt_codigo.value;
    var idEmpresaVincular

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      cpfVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == "" ||
      codigoVar == ""
    ) {
      //cardErro.style.display = "block";
      //mensagem_erro.innerHTML =
        //"(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } else {
      //setInterval(sumirMensagem, 5000);
    }

    // Verificando se o código de ativação é de alguma empresa cadastrada
    for (let i = 0; i < listaEmpresasCadastradas.length; i++) {
      if (listaEmpresasCadastradas[i].cod_ativacao == codigoVar) {
        idEmpresaVincular = listaEmpresasCadastradas[i].idEmpresa
        console.log("Código de ativação válido.");
        break;
      } else {
        //cardErro.style.display = "block";
        //mensagem_erro.innerHTML = "(Mensagem de erro para código inválido)";
        finalizarAguardar();
      }
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        cpfServer: cpfVar,
        senhaServer: senhaVar,
        idEmpresaVincularServer: idEmpresaVincular
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          //cardErro.style.display = "block";

          //mensagem_erro.innerHTML =
            //"Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "/login/login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  // Listando empresas cadastradas 
  function listar() {
    fetch("/empresas/listar", {
      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then((empresas) => {
          empresas.forEach((empresa) => {
            listaEmpresasCadastradas.push(empresa);

            console.log("listaEmpresasCadastradas")
            console.log(listaEmpresasCadastradas[0].cod_ativacao)
          });
        });
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }

</script>
